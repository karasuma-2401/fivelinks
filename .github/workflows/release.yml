name: Multiplatform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.2)"
        required: true
        default: "v1.0.2"

permissions:
  contents: write

jobs:
  release-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble Android APKs
        run: ./gradlew :app:androidApp:assembleDebug :app:androidApp:assembleRelease -PonlineDebugServerUrl=wss://fivelinks-server.onrender.com/ws -PonlineReleaseServerUrl=wss://fivelinks-server.onrender.com/ws --no-daemon --console=plain

      - name: Prepare Android Release Assets
        run: |
          mkdir -p dist
          cp app/androidApp/build/outputs/apk/debug/*.apk dist/FiveLink-android-universal.apk
          if [ -f app/androidApp/build/outputs/apk/release/androidApp-release.apk ]; then
            cp app/androidApp/build/outputs/apk/release/androidApp-release.apk dist/FiveLink-android-release.apk
          elif [ -f app/androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk ]; then
            cp app/androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk dist/FiveLink-android-release-unsigned.apk
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*.apk

  release-desktop:
    name: Build Desktop UberJar (${{ matrix.os_name }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            os_name: windows-x64
          - os: macos-latest
            os_name: macos-arm64
          - os: ubuntu-latest
            os_name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Desktop UberJar
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:desktopApp:packageUberJarForCurrentOS --no-daemon --console=plain
          mkdir -p dist
          cp app/desktopApp/build/compose/jars/*.jar dist/FiveLink-desktop-${{ matrix.os_name }}.jar

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.os_name }}
          path: dist/*.jar

  release-web-and-server:
    name: Build Web (WasmJS & JS) & Server Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Web & Server Distributions
        run: |
          chmod +x ./gradlew
          ./gradlew kotlinUpgradeYarnLock kotlinWasmUpgradeYarnLock :app:webApp:wasmJsBrowserDistribution :app:webApp:jsBrowserDistribution :server:distZip --no-daemon --console=plain
          mkdir -p dist
          (cd app/webApp/build/dist/wasmJs/productionExecutable && zip -r ../../../../../../dist/FiveLink-web-wasmJs.zip .)
          (cd app/webApp/build/dist/js/productionExecutable && zip -r ../../../../../../dist/FiveLink-web-js.zip .)
          cp server/build/distributions/server-*.zip dist/FiveLink-server-bundle.zip

      - name: Upload Web & Server Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-web-and-server
          path: dist/*.zip

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [release-android, release-desktop, release-web-and-server]
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "FiveLink ${{ github.event.inputs.tag_name || github.ref_name }}"
          generate_release_notes: true
          files: release-assets/*

