name: CI / Quality Assurance & Release Engineering

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Integration Tests (Core, Shared, Server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Test Suites
        run: ./gradlew :core:jvmTest :app:shared:jvmTest :server:test --no-daemon --console=plain

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/shared/build/reports/tests/
            server/build/reports/tests/

  build-artifacts:
    name: Verify Multiplatform Builds (Desktop, Web, Server)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Desktop and Server Distributions
        run: ./gradlew :app:desktopApp:jar :server:installDist --no-daemon --console=plain

      - name: Build Web Application
        run: ./gradlew :app:webApp:jsBrowserDistribution --no-daemon --console=plain

  build-android:
    name: Verify Android Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble Android Debug APK
        run: ./gradlew :app:androidApp:assembleDebug --no-daemon --console=plain

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fivelinks-android-debug
          path: app/androidApp/build/outputs/apk/debug/app-androidApp-debug.apk

  build-docker:
    name: Verify Server Container Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: false
          tags: fivelinks-server:test

